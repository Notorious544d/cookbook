name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: site
        uses: Notorious544d/cookdb@v0.1.0
        with:
          recipes-dir: .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}
      - id: deployment
        uses: actions/deploy-pages@v4